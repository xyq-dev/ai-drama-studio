<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>红果创作 · 角色配音设计预览</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#24232a;--muted:#737079;--line:#e7e5e0;--red:#d34846;--soft:#fcf0ec;--green:#347563;--amber:#956415}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e09b69;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:1.35;letter-spacing:-.6px}h2{font-size:20px}h3{font-size:17px}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--red);font-weight:700}.banner{padding:9px 24px;text-align:center;background:#332f32;color:#fff;font-size:13px}.header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px 11px 11px 3px;background:var(--red);color:#fff;font-size:20px}.header-right{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--muted)}.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:calc(100vh - 115px)}aside{padding:31px 20px;border-right:1px solid var(--line)}.project{padding:0 14px 24px}.project strong{display:block;font-size:19px}.step{padding:14px;display:flex;align-items:center;gap:13px;border-radius:10px;margin-bottom:6px;color:var(--muted)}.step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border:1px solid #d7d3cb;border-radius:50%;font-size:12px}.step.active{background:#f6e6df;color:#a63735;font-weight:700}.step.active i{background:var(--red);color:#fff;border:0}.side-note{margin:40px 12px 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}main{padding:30px 36px 40px;max-width:1600px;min-width:0}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:30px;overflow:auto}.tabs button{border:0;background:none;color:var(--muted);padding:10px 15px 15px;white-space:nowrap;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--red);border-color:var(--red);font-weight:700}.intro{margin-bottom:25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.intro p{margin-top:10px;color:var(--muted);max-width:680px}.badge{font-size:12px;display:inline-flex;align-items:center;padding:3px 9px;background:#edf4ef;color:var(--green);border-radius:5px;white-space:nowrap}.badge.amber{background:#fff1db;color:var(--amber)}.badge.red{background:var(--soft);color:var(--red)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 278px;gap:24px}.stack{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:23px}.card-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}.btn{border:1px solid #d9d4cc;background:white;border-radius:8px;padding:9px 15px;font-size:14px;font-weight:600}.btn.primary{background:var(--red);color:white;border-color:var(--red)}.btn.quiet{background:transparent;color:var(--muted)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.cast{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:18px}.avatar{width:64px;height:76px;border-radius:9px;background:#e9ded0;display:grid;place-items:center;color:#786456;font-size:24px;font-weight:700}.avatar.blue{background:#dce5e9;color:#4e6673}.avatar.rose{background:#efe4e2;color:#997873}.name{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.voice-info{margin-top:8px;font-size:14px}.wave{display:flex;gap:3px;height:22px;align-items:center;margin-right:10px}.wave b{background:#d3a296;width:3px;height:var(--h,12px);border-radius:2px}.review-box{background:#2e3234;border-radius:12px;padding:24px;color:#f8f5ee}.review-box .muted{color:#b7bdba}.review-box h2{color:#fff;margin:12px 0}.review-box .btn{width:100%;margin-top:22px}.check{display:flex;gap:10px;margin:14px 0;font-size:14px}.check span{color:#a9cab4}.note{padding:15px 18px;border:1px solid #ead5c0;background:#fff8ec;border-radius:10px;font-size:14px;color:#7e6036}.note.red{background:#fff3ef;border-color:#eed2c9;color:#983f3a}.rail-note{font-size:13px;color:var(--muted);padding:18px 5px}.line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}.line-no{color:#aaa399;font-family:monospace;font-size:20px}.quote{font-size:19px;line-height:1.7;margin:10px 0 16px}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;color:#736d65}.fields{display:flex;gap:12px;margin-bottom:17px;flex-wrap:wrap}.fields label{font-size:12px;color:var(--muted)}select{display:block;border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 8px;color:var(--text);max-width:100%}.player{background:#ece9e3;border-radius:9px;padding:13px;display:flex;align-items:center;gap:14px;font-size:13px;margin:14px 0}.player .track{height:3px;flex:1;background:#c8c5bd}.player .track:before{content:"";display:block;height:3px;width:38%;background:var(--red)}.timeline{display:grid;grid-template-columns:75px minmax(0,1fr);gap:12px;margin:20px 0}.lane-name{color:var(--muted);font-size:13px;padding-top:12px}.lane{display:flex;gap:7px;border-bottom:1px solid #eee9e1;padding:8px 0}.clip{background:#e0e8e6;color:#436f64;border-radius:6px;padding:10px;min-width:0;font-size:12px;flex:1}.clip.pink{background:#f2e0d8;color:#a36552}.clip.purple{background:#e9e4ef;color:#78658b}.clip.gray{background:#e9e8e3;color:#79766a}.film{background:#303f47;color:#fff;border-radius:9px;min-height:190px;display:grid;place-items:center;text-align:center;padding:28px}.film strong{font-size:25px;display:block;letter-spacing:4px}.film p{font-size:13px;color:#c1cbd0;margin-top:12px}.metrics{display:flex;gap:25px;padding:17px 0 0;flex-wrap:wrap}.metrics strong{font-size:20px;display:block}.metrics span{font-size:12px;color:var(--muted)}.bottom{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.toggle-status{margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;background:#24232a;color:#fff;max-width:calc(100vw - 30px);z-index:9;box-shadow:0 8px 28px #0002;font-size:14px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:500px;width:calc(100% - 32px);color:var(--text)}dialog::backdrop{background:#28212670}dialog p{margin:14px 0 22px;color:var(--muted)}dialog .actions{justify-content:flex-end}.voice-options{display:grid;gap:10px;margin:16px 0}.voice-options button{text-align:left}.voice-options small{display:block;font-weight:400;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr) 240px}main{padding:24px}.shell{grid-template-columns:190px minmax(0,1fr)}.cast{grid-template-columns:54px minmax(0,1fr)}.cast>.actions{grid-column:2}.avatar{width:54px;height:66px}}
@media(max-width:800px){.shell{display:block}aside{display:none}.header{padding:0 18px;height:66px}.header-right span{display:none}.banner{padding:8px 14px;font-size:12px}main{padding:18px 16px 40px}.tabs{margin-bottom:23px}.tabs button{padding:8px 11px 12px;font-size:14px}.intro{display:block}h1{font-size:27px}.intro>.badge{margin-top:12px}.intro p{font-size:14px}.layout{display:block}.layout>section+section,.layout>div+section{margin-top:20px}.card{padding:18px}.quote{font-size:17px}.bottom{align-items:start;flex-direction:column}.bottom .btn{width:100%}.review-box{margin-top:18px}.card-head{flex-wrap:wrap}.timeline{grid-template-columns:51px minmax(0,1fr);gap:7px}.clip{padding:9px 6px;font-size:11px}.fields{gap:8px}.lane-name{font-size:12px}.metrics{gap:18px}.toast{font-size:13px}.header-right{font-size:12px}}
</style>
</head>
<body>
<div class="banner">交互设计预览 · 全部为示例数据 · 不会生成声音、调用模型或产生费用</div>
<header class="header"><div class="brand"><span class="mark" aria-hidden="true">果</span>红果创作</div><div class="header-right"><span>我的作品</span><span>灵感中心</span><a href="../CHARACTER_VOICE_DESIGN.md">查看设计说明 ↗</a></div></header>
<div class="shell"><aside><div class="project"><span class="eyebrow">声音导演 / 示例作品</span><strong>夜雨来信</strong><span class="muted small">第 1 集 · 雨夜的重逢</span></div><div class="step"><i>1</i>定故事</div><div class="step"><i>2</i>看剧本</div><div class="step active" id="side3"><i>3</i>定人物</div><div class="step" id="side4"><i>4</i>试一段</div><div class="step" id="side5"><i>5</i>出成片</div><div class="side-note">你决定声音与表演。<br>系统负责安排任务、保存版本和检查时长。<br><br>当前只是设计原型。</div></aside><main>
<nav class="tabs" role="tablist" aria-label="配音设计页面"><button id="tab-cast" role="tab" aria-controls="content" aria-selected="true" data-tab="cast">01 角色声音</button><button id="tab-lines" role="tab" aria-controls="content" aria-selected="false" tabindex="-1" data-tab="lines">02 台词试听</button><button id="tab-mix" role="tab" aria-controls="content" aria-selected="false" tabindex="-1" data-tab="mix">03 声画检查</button><button id="tab-delivery" role="tab" aria-controls="content" aria-selected="false" tabindex="-1" data-tab="delivery">04 成片确认</button></nav>
<div id="content" role="tabpanel" aria-labelledby="tab-cast"></div>
</main></div><div class="toast" role="status" aria-live="polite" id="toast"></div>
<dialog id="voices" aria-labelledby="voice-title"><h2 id="voice-title">为林晚选择声音</h2><p>下面是产品展示用的音色分类，名称不对应已接通的服务商音色。正式版只显示当前模型可用的授权音色。</p><div class="voice-options"><button class="btn" data-voice="温柔而坚定">温柔而坚定<small>女声 · 普通话 · 示例</small></button><button class="btn" data-voice="清亮有活力">清亮有活力<small>女声 · 普通话 · 示例</small></button><button class="btn" data-voice="沉静有分寸">沉静有分寸<small>女声 · 普通话 · 示例</small></button></div><div class="actions"><button class="btn" data-action="close">取消</button></div></dialog>
<script>
const state={tab:'cast',voice:'温柔而坚定',takeVoice:'温柔而坚定',selectedVoice:null,selected:false,candidateVersion:1,selectedVersion:0,overflow:false};let toastTimer;
const content=document.getElementById('content');const dialog=document.getElementById('voices');
function toast(t){clearTimeout(toastTimer);document.getElementById('toast').textContent=t;toastTimer=setTimeout(()=>{document.getElementById('toast').textContent=''},5000)}
const wave='<span class="wave" aria-hidden="true">'+[7,14,20,11,17,22,15,9,18,13,7,15].map(n=>`<b style="--h:${n}px"></b>`).join('')+'</span>';
function intro(k,title,text,badge='设计示例'){return `<div class="intro"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${text}</p></div><span class="badge">${badge}</span></div>`}
function right(title,text,checks,button,next){return `<section><div class="review-box"><span class="eyebrow" style="color:#e2bca7">下一步，很简单</span><h2>${title}</h2><p class="muted small">${text}</p>${checks.map(x=>`<div class="check"><span>✓</span><div>${x}</div></div>`).join('')}<button class="btn primary" data-tab="${next}">${button} →</button></div><div class="rail-note">这些页面展示目标交互。声音生成、保存和计费均未接通。</div></section>`}
function castCard(name,role,voice,klass,initial,action){return `<article class="card cast"><div class="avatar ${klass}" aria-hidden="true">${initial}</div><div><div class="name"><h3>${name}</h3><span class="pill">${role}</span></div><div class="voice-info">${voice}</div><div class="small muted">普通话 · 同一角色保持同一声音</div></div><div class="actions"><button class="btn" data-action="listen" aria-label="试听${name}的示例声音">▷ 听声音</button><button class="btn quiet" data-action="${action}">换一个</button></div></article>`}
function render(){const current=state.selected&&state.selectedVoice===state.voice;const candidateSelected=current&&state.selectedVersion===state.candidateVersion;document.querySelectorAll('[role=tab]').forEach(b=>{const on=b.dataset.tab===state.tab;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});content.setAttribute('aria-labelledby','tab-'+state.tab);['3','4','5'].forEach(n=>document.getElementById('side'+n).classList.toggle('active',n===({cast:'3',lines:'4',mix:'4',delivery:'5'}[state.tab])));
if(state.tab==='cast')content.innerHTML=intro('STEP 03 / 定人物','让每个角色，都有自己的声音','先选喜欢的声音，再听一小段。以后每集都沿用你的选择，随时可以比较和更换。')+`<div class="layout"><section class="stack">${castCard('林晚','主角',state.voice,'','晚','choose')}${castCard('周衡','主角','低沉、克制，语气自然','blue','衡','not-ready')}${castCard('旁白','叙述','清晰平稳，留出故事的呼吸','rose','叙','not-ready')}<div class="note">声音预设可先浏览。使用你的台词生成试听，需要先确认本次调用费用。</div></section>${right('先听一个镜头','不用一次完成整部剧。先确认两个人说话的感觉。',['角色与台词一一对应','只生成你选中的一小段','不满意时只重做一句'],'看看台词试听','lines')}</div>`;
if(state.tab==='lines')content.innerHTML=intro('STEP 04 / 试一段','先把这一句，说到心里','第 1 集 · 镜头 02 ｜ 人物相遇。逐句听，逐句定；新的候选不会覆盖你已经选中的版本。')+`<div class="layout"><section class="stack"><article class="card"><div class="line"><div class="line-no">01</div><div><div class="name"><h3>林晚</h3><span class="pill">候选声音：${state.takeVoice}</span><span class="badge">${candidateSelected?'示例：已选用':current?'示例：旧版已选用':state.selected?'示例：来源更新':'示例：待试听'}</span></div>${state.takeVoice!==state.voice?'<p class="small" style="color:var(--red)">角色已换声，当前候选仍是旧声音。先生成新候选，再试听选用。</p>':''}<p class="quote">“这封信，你一直替我留着？”</p><div class="fields"><label>怎么说<select aria-label="林晚的情绪"><option>自然、轻声</option><option>惊讶</option><option>难过</option></select></label><label>语速<select aria-label="林晚的语速"><option>正常</option><option>稍慢</option></select></label><label>说完停一下<select aria-label="林晚台词后停顿"><option>0.3 秒</option><option>0.5 秒</option></select></label></div><div class="player"><button class="btn" data-action="listen" aria-label="试听第1句候选">▷</button>${wave}<div class="track"></div><span>示例 2.8 秒</span></div><div class="actions"><button class="btn primary" data-action="select" ${state.takeVoice!==state.voice?'disabled':''}>${candidateSelected?'已选用此示例':'使用这一版 · 演示'}</button><button class="btn" data-action="regenerate">再试一版 · 演示</button><span class="muted small">只重做本句</span></div></div></div></article><article class="card"><div class="line"><div class="line-no">02</div><div><div class="name"><h3>周衡</h3><span class="pill">低沉、克制</span><span class="badge">示例：已选用</span></div><p class="quote">“我答应过你，要亲手交给你。”</p><div class="actions"><button class="btn" data-action="listen">▷ 试听</button><span class="small muted">版本 1 · 示例 3.2 秒</span></div></div></div></article><div class="note">情绪、方言和发音选项只在服务商支持时开放。本原型不提供实际音频。</div></section>${right('听起来满意了吗？','选好的音频会用于本镜头。下一页检查对白是否能完整放进画面。',['逐句比较，保留旧版本','确认后再进入成片','费用以实际服务回执为准'],'检查声音与画面','mix')}</div>`;
if(state.tab==='mix')content.innerHTML=intro('STEP 04 / 声画检查','让对白完整，也让停顿自然','声音时间来自实际音频。太长会提醒你处理，不会悄悄裁掉台词。')+`<div class="layout"><section class="stack"><article class="card"><div class="card-head"><h2>镜头 02 · 雨夜重逢</h2><span class="badge ${state.overflow?'amber':''}">${state.overflow?'示例：时长冲突':current?'示例：可以继续':'示例：声音待确认'}</span></div><div class="film"><div><strong>夜雨来信</strong><p>画面位置示意 · 这里没有真实视频</p></div></div><div class="timeline"><div class="lane-name">画面</div><div class="lane"><div class="clip gray">镜头 02 · 8.0 秒</div></div><div class="lane-name">对白</div><div class="lane"><div class="clip pink">林晚 · ${state.overflow?'5.4':'2.8'}s</div><div class="clip">周衡 · 3.2s</div></div><div class="lane-name">字幕</div><div class="lane"><div class="clip purple">与选中音频同源</div></div><div class="lane-name">音乐</div><div class="lane"><div class="clip gray">对白时降低背景音乐</div></div></div><div class="metrics"><div><strong>8.0s</strong><span>示例画面时长</span></div><div><strong>${state.overflow?'9.2':'6.6'}s</strong><span>示例对白与停顿</span></div><div><strong>${state.overflow?'超出 1.2s':'保留 1.4s'}</strong><span>${state.overflow?'不能直接合成':'自然留白'}</span></div></div></article><div class="note ${state.overflow?'red':''}">${state.overflow?'这段对白比画面长。请修改台词、重新调整语速，或返回选择更长的镜头。配音不会被自动截断。':'时长合适时，保留句间停顿和尾部留白。字幕时间跟随实际选中的声音。'}</div><div><button class="btn quiet" data-action="overflow">${state.overflow?'查看正常状态':'演示“对白太长”'}</button></div></section><section><div class="review-box"><span class="eyebrow" style="color:#e2bca7">合成前先检查</span><h2>${state.overflow?'先处理时长冲突':current?'这一段准备好了':'先选用当前声音'}</h2><div class="check"><span>${current?'✓':'!'}</span>${current?'台词和音色版本一致':'林晚还没有选用当前声音'}</div><div class="check"><span>${current?'✓':'!'}</span>${current?'字幕对应选中音频':'选用音频后重新检查字幕'}</div><div class="check"><span>${state.overflow?'!':'✓'}</span>${state.overflow?'对白超出镜头时长':'每句对白都能完整播放'}</div><button class="btn primary" data-tab="delivery" ${state.overflow||!current?'disabled':''}>查看交付设计 →</button></div><div class="rail-note">正式版需要先完成合成任务，再观看和审核。这是交互演示，不会创建任务。</div></section></div>`;
if(state.tab==='delivery')content.innerHTML=intro('STEP 05 / 出成片','最后，认真看一遍你的故事','确认对白、字幕与画面都满意，再通过审核并下载。每一个声音都有可追溯的来源。')+`<div class="layout"><section class="stack"><article class="card"><div class="card-head"><div><h2>夜雨来信 · 第 1 集</h2><p class="small muted">设计示例 · 实际项目尚未生成这份配音成片</p></div><span class="badge amber">目标状态：待审核</span></div><div class="film"><div><strong>每个角色，都值得被听见。</strong><p>正式版在这里播放含真实配音的完整成片</p></div></div><div class="player"><button class="btn" data-action="listen">▷</button><div class="track"></div><span>设计示意</span></div><div class="actions"><button class="btn primary" data-action="review">看完并确认使用</button><button class="btn" data-tab="lines">返回调整声音</button></div></article><article class="card"><div class="card-head"><h2>本次声音来源</h2><span class="pill">随清单导出</span></div><p class="muted small">角色声音版本 · 每句选中的音频 · 模型与参数 · 字幕时间线 · 配音与音乐的来源 · 文件哈希</p></article></section><section><div class="card"><div class="eyebrow">交付检查</div><h2 style="margin-top:10px">完成后，你会得到</h2><div class="check"><span>✓</span>含对白、字幕与音乐的 MP4</div><div class="check"><span>✓</span>与该成片一致的来源清单</div><div class="check"><span>✓</span>已记录费用与未知费用说明</div><div class="actions" style="margin-top:20px"><button class="btn" data-action="download">下载 MP4</button><button class="btn" data-action="download">来源清单</button></div></div><div class="note" style="margin-top:18px">真实生成费用：待服务商配置。<br>本地编码成本：尚未完整计量。<br>本原型不会产生下载或费用。</div></section></div>`;

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){state.tab=b.dataset.tab;render();return}if(b.dataset.voice){state.voice=b.dataset.voice;dialog.close();render();document.querySelector('[data-action=choose]')?.focus();toast('示例声音已更换；正式版将先列出受影响台词和成片，再确认保存。');return}switch(b.dataset.action){case'choose':dialog.showModal();break;case'close':dialog.close();break;case'listen':toast('这是设计原型，没有音频文件；正式版播放授权示例或已生成的声音。');break;case'select':state.selected=true;state.selectedVoice=state.takeVoice;state.selectedVersion=state.candidateVersion;render();toast('已演示选用。没有写入服务器，也没有发生模型调用。');break;case'regenerate':state.takeVoice=state.voice;state.candidateVersion++;render();toast('已切换到新候选的示例状态，旧选择保留。本次没有生成声音或产生费用；正式版需先确认调用。');break;case'overflow':state.overflow=!state.overflow;render();break;case'review':toast('正式版只有真实成片播放、来源校验及明确审核后，才允许下载。');break;case'download':toast('没有可下载成片。这是设计原型，不能当作交付证据。');break;case'scope':toast('第一版：预置音色、双角色逐句配音、字幕、混音与导出。克隆和口型同步另行实现。');break;default:toast('此角色卡用于布局展示。可通过林晚的“换一个”演示选择流程。')}});
document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('[role=tab]')];let i=tabs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;state.tab=tabs[i].dataset.tab;render();tabs[i].focus()});
render();
