name: M3-A integration

on:
  push:
    branches:
      - feat/m3-media-generation-chain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_m3a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_m3a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_m3a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build providers and database
        run: |
          pnpm --filter @ai-drama/providers build
          pnpm --filter @ai-drama/database build

      - name: Run provider contract tests
        run: pnpm --filter @ai-drama/providers test

      - name: Run PostgreSQL integration
        run: pnpm --filter @ai-drama/database integration

      - name: Verify workspace
        run: pnpm verify
