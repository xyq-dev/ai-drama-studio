name: M4 compose preflight end-to-end

on:
  push:
    branches:
      - feat/m4-compose-preflight
    paths:
      - ".github/workflows/m4-compose-preflight-e2e.yml"
      - "scripts/m3-av-e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - "infra/compose.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-compose-preflight-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Testing
        run: pnpm exec playwright install --with-deps chrome

      - name: Build workspace
        run: pnpm build

      - name: Check acceptance harness
        run: pnpm m3-av-e2e:check

      - name: Run acceptance outcome regression
        run: pnpm m3-av-e2e:outcome

      - name: Run real page, API, worker, and database acceptance
        run: node scripts/m3-av-e2e/run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-compose-preflight-e2e-evidence
          path: m3-av-e2e-output
          retention-days: 7
          if-no-files-found: warn
