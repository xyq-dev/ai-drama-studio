name: M1-C integration

on:
  push:
    branches:
      - feat/m1c-runtime-mock-loop
  pull_request:
    branches:
      - feat/m1b-persistence-job-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_m1c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_m1c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_m1c
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/media-worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Run M1-B PostgreSQL integration
        run: pnpm --filter @ai-drama/database integration

      - name: Run M1-C Worker and BullMQ integration
        run: pnpm --filter @ai-drama/worker integration

      - name: Run M1-C API and SSE integration
        run: pnpm --filter @ai-drama/api integration

      - name: Verify JavaScript workspace
        run: pnpm verify

      - name: Test Python media worker
        run: |
          python -m pip install -e "services/media-worker[dev]"
          pytest services/media-worker/tests
