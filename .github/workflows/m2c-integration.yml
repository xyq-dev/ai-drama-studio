name: M2-C integration

on:
  push:
    branches:
      - feat/m2c-text-api-mock-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_m2c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_m2c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_m2c
      REDIS_URL: redis://127.0.0.1:6379
      APP_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/media-worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build JavaScript workspace
        run: pnpm build

      - name: Run M1/M2 PostgreSQL integration
        run: pnpm --filter @ai-drama/database integration

      - name: Run API integration
        run: pnpm --filter @ai-drama/api integration

      - name: Verify JavaScript workspace
        run: pnpm verify

      - name: Test Python media worker
        run: |
          python -m pip install -e "services/media-worker[dev]"
          pytest services/media-worker/tests
