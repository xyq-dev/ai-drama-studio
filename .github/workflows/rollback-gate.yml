name: Rollback Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable GitHub Release tag to validate for rollback"
        required: true
        type: string
      confirm:
        description: "Type ROLLBACK to confirm rollback validation"
        required: true
        type: string
      incident_ref:
        description: "Optional incident or ticket reference"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-gate
  cancel-in-progress: false

jobs:
  validate-rollback-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_rollback_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_rollback_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_rollback_gate
      REDIS_URL: redis://127.0.0.1:6379
      APP_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111
      RELEASE_TAG: ${{ inputs.release_tag }}
      CONFIRM: ${{ inputs.confirm }}
      INCIDENT_REF: ${{ inputs.incident_ref }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [[ "$CONFIRM" != "ROLLBACK" ]]; then
            echo "confirm must equal ROLLBACK" >&2
            exit 1
          fi

      - name: Check out rollback release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/tmp/release.txt
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/media-worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build workspace
        run: pnpm build

      - name: Run PostgreSQL integration
        run: pnpm --filter @ai-drama/database integration

      - name: Provision configured workspace
        run: pnpm --filter @ai-drama/database workspace:provision

      - name: Run Worker integration
        run: pnpm --filter @ai-drama/worker integration

      - name: Run API integration
        run: pnpm --filter @ai-drama/api integration

      - name: Verify JavaScript workspace
        run: pnpm verify

      - name: Test Python media worker
        run: |
          python -m pip install -e "services/media-worker[dev]"
          pytest services/media-worker/tests

      - name: Build rollback manifest
        shell: bash
        run: |
          mkdir -p .rollback
          cat > .rollback/rollback-manifest.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "releaseTag": "$RELEASE_TAG",
            "commitSha": "$TARGET_SHA",
            "incidentRef": "$INCIDENT_REF",
            "workflowRun": "${{ github.run_id }}",
            "rollbackTargetValidated": true,
            "productionDeploymentExecuted": false,
            "databaseRollbackExecuted": false
          }
          EOF

      - name: Upload rollback manifest
        uses: actions/upload-artifact@v4
        with:
          name: rollback-manifest-${{ inputs.release_tag }}
          path: .rollback/rollback-manifest.json
          if-no-files-found: error

      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo "## Rollback target validated"
            echo
            echo "- Release: `$RELEASE_TAG`"
            echo "- Commit: `$TARGET_SHA`"
            echo "- Incident: `${INCIDENT_REF:-not-provided}`"
            echo "- Production deployment executed: **no**"
            echo "- Database rollback executed: **no**"
            echo
            echo "This repository does not yet have a production deployment adapter."
            echo "When deployment is introduced, CI/CD must redeploy this validated stable tag and then run Smoke Tests."
          } >> "$GITHUB_STEP_SUMMARY"
