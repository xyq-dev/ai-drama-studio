name: M1-A integration

on:
  push:
    branches:
      - feat/m1-platform-skeleton
  pull_request:
    branches:
      - feat/m1-platform-skeleton
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/media-worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test JavaScript workspace
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify JavaScript workspace
        run: pnpm verify

      - name: Install and test media worker
        run: |
          python -m pip install -e "services/media-worker[dev]"
          pytest services/media-worker/tests

      - name: Run M1-A infrastructure integration checks
        run: scripts/ci/m1a-integration.sh

      - name: Clean up integration services
        if: always()
        run: scripts/ci/m1a-integration.sh cleanup

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m1a-integration-logs
          path: /tmp/ai-drama-ci/
          if-no-files-found: warn
          retention-days: 7
