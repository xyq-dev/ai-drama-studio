name: Beginner creator web

on:
  push:
    branches:
      - feat/beginner-creator-experience
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beginner-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_beginner_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_beginner_web"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_beginner_web
      REDIS_URL: redis://127.0.0.1:6379
      APP_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111
      BEGINNER_ACCEPTANCE_DATABASE: ai_drama_beginner_web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build JavaScript workspace
        run: pnpm build

      - name: Drive the beginner pages against the real API and database
        run: node scripts/beginner-web-acceptance.mjs

      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beginner-web-evidence
          path: beginner-web-evidence
          if-no-files-found: ignore
