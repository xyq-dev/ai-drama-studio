name: Writing assistant API

on:
  push:
    branches:
      - feat/drama-writing-assistant
      - main
  pull_request:
    branches:
      - feat/commercial-creator-ui
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-adopt-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_writing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_writing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_writing
      REDIS_URL: redis://127.0.0.1:6379
      APP_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111
      WRITING_ACCEPTANCE_DATABASE: ai_drama_writing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build JavaScript workspace
        run: pnpm build

      - name: Import, adopt, save, and reread without a model
        run: pnpm --filter @ai-drama/api exec vitest run --config vitest.integration.config.ts src/studio/writing-assistant.acceptance.integration.spec.ts

  web-import-adopt-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_drama_writing_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_drama_writing_web"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_drama_writing_web
      REDIS_URL: redis://127.0.0.1:6379
      APP_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111
      WRITING_ACCEPTANCE_DATABASE: ai_drama_writing_web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate and generate Prisma
        run: |
          pnpm --filter @ai-drama/database prisma:validate
          pnpm --filter @ai-drama/database prisma:generate

      - name: Build JavaScript workspace
        run: pnpm build

      - name: Import through the real workbench, adopt, save, and reread
        run: node scripts/writing-assistant-web-acceptance.mjs
