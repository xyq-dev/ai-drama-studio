name: M4 project cost summary end-to-end

on:
  push:
    branches:
      - feat/m4-project-cost-summary
    paths:
      - ".github/workflows/m4-project-cost-e2e.yml"
      - "scripts/m3-av-e2e/**"
      - "scripts/run-media-worker-tests.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "infra/compose.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-project-cost-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned media tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg=7:6.1.1-3ubuntu5 \
            fonts-dejavu-core=2.37-8 \
            python3 \
            python3-venv \
            python3-pytest=7.4.4-1
          test "$(dpkg-query -W -f '${Version}' ffmpeg)" = "7:6.1.1-3ubuntu5"
          test "$(dpkg-query -W -f '${Version}' fonts-dejavu-core)" = "2.37-8"
          test "$(dpkg-query -W -f '${Version}' python3-pytest)" = "7.4.4-1"
          python3 -m venv "$RUNNER_TEMP/media-worker-venv"
          "$RUNNER_TEMP/media-worker-venv/bin/pip" install -e "services/media-worker[dev]"
          echo "MEDIA_WORKER_PYTHON=$RUNNER_TEMP/media-worker-venv/bin/python" >> "$GITHUB_ENV"
          python3 --version
          "$RUNNER_TEMP/media-worker-venv/bin/python" --version
          ffmpeg -version
          ffprobe -version
          ffmpeg -buildconf
          sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Install Chrome for Testing
        run: pnpm exec playwright install --with-deps chrome

      - name: Build workspace
        run: pnpm build

      - name: Run Python compose tests
        run: |
          "$MEDIA_WORKER_PYTHON" -m pytest services/media-worker/tests -q
          node scripts/run-media-worker-tests.mjs

      - name: Check acceptance harness
        run: pnpm m3-av-e2e:check

      - name: Run acceptance outcome regression
        run: pnpm m3-av-e2e:outcome

      - name: Run real page, API, worker, and database acceptance
        run: node scripts/m3-av-e2e/run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-project-cost-e2e-evidence
          path: m3-av-e2e-output
          retention-days: 7
          if-no-files-found: warn
